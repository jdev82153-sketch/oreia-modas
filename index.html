<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oreia Modas | Loja Exclusiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white font-sans">

    <nav class="fixed w-full z-50 p-6 flex justify-between items-center bg-black/80 backdrop-blur-md border-b border-zinc-800">
        <h1 class="font-black italic text-xl">OREIA MODAS</h1>
        <a href="https://wa.me/5517997557816" class="bg-orange-500 text-black px-4 py-2 rounded-lg font-black text-xs hover:scale-105 transition-transform">ZAP</a>
    </nav>

    <section class="h-[80vh] flex flex-col justify-center items-center text-center px-6">
        <h2 class="text-6xl md:text-8xl font-black uppercase tracking-tighter mb-4">ESTILO &<br><span class="text-orange-500">ATITUDE</span></h2>
        <p class="text-zinc-400 mb-8 max-w-sm">A sua nova referência de moda em Jales-SP.</p>
    </section>

    <section id="vitrine" class="py-12 px-6 max-w-5xl mx-auto">
        <div class="grid md:grid-cols-3 gap-6">
            <button onclick="openModal('Kit Balenciaga')" class="bg-zinc-900 p-2 rounded-2xl hover:border border-orange-500 transition-all">
                <img src="kit1.jpg" class="w-full h-80 object-cover rounded-xl">
            </button>
            <button onclick="openModal('Kit Gucci')" class="bg-zinc-900 p-2 rounded-2xl hover:border border-orange-500 transition-all">
                <img src="kit2.jpg" class="w-full h-80 object-cover rounded-xl">
            </button>
            <button onclick="openModal('Kit Nuvem')" class="bg-zinc-900 p-2 rounded-2xl hover:border border-orange-500 transition-all">
                <img src="kit3.jpg" class="w-full h-80 object-cover rounded-xl">
            </button>
        </div>
    </section>

    <div id="modal" class="hidden fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-6">
        <div class="bg-zinc-900 p-8 rounded-3xl w-full max-w-sm border border-zinc-700 text-center">
            <h3 id="modalTitle" class="text-2xl font-black mb-6 uppercase">Produto</h3>
            <div class="space-y-4">
                <a id="btnZap" href="#" class="block bg-green-600 py-4 rounded-xl font-bold hover:bg-green-500 transition-all">
                    <i class="fab fa-whatsapp mr-2"></i> Chamar no Zap
                </a>
                <a id="btnInsta" href="https://instagram.com/oreia_modas" class="block bg-pink-600 py-4 rounded-xl font-bold hover:bg-pink-500 transition-all">
                    <i class="fab fa-instagram mr-2"></i> Ver no Instagram
                </a>
                <button onclick="closeModal()" class="text-zinc-500 font-bold underline mt-4">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        function openModal(produto) {
            document.getElementById('modalTitle').innerText = produto;
            document.getElementById('btnZap').href = "https://wa.me/5517997557816?text=Olá, quero saber mais sobre o " + produto;
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    </script>

</body>
</html>
