<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oreia Modas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Syne', sans-serif; }</style>
</head>
<body class="bg-[#050505] text-white">

    <nav class="fixed w-full z-50 p-4 flex justify-between items-center backdrop-blur-md bg-black/80 border-b border-white/10">
        <div class="flex items-center gap-3">
            <img src="logo.jpg" class="w-10 h-10 rounded-full object-cover border border-orange-500 shadow-[0_0_10px_rgba(249,115,22,0.5)]">
            <h1 class="text-xl font-black italic tracking-tighter">OREIA MODAS</h1>
        </div>
        <a href="#contato" class="border border-white/20 px-4 py-2 rounded-full text-xs font-bold hover:bg-white hover:text-black transition-all">CONTATO</a>
    </nav>

    <section class="h-[80vh] flex flex-col justify-center items-center text-center p-6">
        <h2 data-aos="fade-down" class="text-6xl md:text-8xl font-black uppercase tracking-tighter leading-none mb-6">VISTA <br><span class="text-orange-500">O PODER</span></h2>
        <a href="#vitrine" data-aos="fade-up" data-aos-delay="200" class="bg-orange-500 px-10 py-4 rounded-full font-black text-black hover:scale-105 transition-transform">VER COLEÇÃO</a>
    </section>

    <section id="vitrine" class="py-20 px-6 max-w-6xl mx-auto">
        <h3 class="text-4xl font-black uppercase mb-16 text-center">Nossos Kits</h3>
        <div class="grid md:grid-cols-3 gap-8">
            <div data-aos="zoom-in" onclick="openModal('Kit Balenciaga', 'kit1.jpg')" class="cursor-pointer group relative overflow-hidden rounded-3xl bg-zinc-900"><img src="kit1.jpg" class="w-full h-[500px] object-cover group-hover:scale-110 transition-transform duration-700"><div class="absolute bottom-6 left-6"><p class="font-bold text-2xl">Kit Balenciaga</p></div></div>
            <div data-aos="zoom-in" data-aos-delay="200" onclick="openModal('Kit Gucci', 'kit2.jpg')" class="cursor-pointer group relative overflow-hidden rounded-3xl bg-zinc-900"><img src="kit2.jpg" class="w-full h-[500px] object-cover group-hover:scale-110 transition-transform duration-700"><div class="absolute bottom-6 left-6"><p class="font-bold text-2xl">Kit Gucci</p></div></div>
            <div data-aos="zoom-in" data-aos-delay="400" onclick="openModal('Kit Nuvem', 'kit3.jpg')" class="cursor-pointer group relative overflow-hidden rounded-3xl bg-zinc-900"><img src="kit3.jpg" class="w-full h-[500px] object-cover group-hover:scale-110 transition-transform duration-700"><div class="absolute bottom-6 left-6"><p class="font-bold text-2xl">Kit Nuvem</p></div></div>
        </div>
    </section>

    <div id="modal" class="hidden fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-6">
        <div class="bg-zinc-900 p-2 rounded-3xl w-full max-w-md relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 bg-black/50 p-2 rounded-full"><i class="fas fa-times"></i></button>
            <img id="modalImg" src="" class="w-full h-96 object-cover rounded-2xl mb-6">
            <div class="p-4 text-center">
                <h3 id="modalTitle" class="text-3xl font-black mb-6"></h3>
                <a id="btnZap" href="#" class="block bg-green-600 text-white py-4 rounded-xl font-black hover:bg-green-500 transition-all">FALAR SOBRE ESTA ROUPA</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
        function openModal(nome, img) {
            document.getElementById('modalTitle').innerText = nome;
            document.getElementById('modalImg').src = img;
            document.getElementById('btnZap').href = "https://wa.me/5517997557816?text=Olá! Gostaria de saber mais sobre: " + nome;
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    </script>
</body>
</html>
